name: Pruebas del bot
on:
  push:
    branches: [test, main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - name: Auditoría de dependencias (incluye transitivas)
        run: npm audit --json > audit.json || true
      - name: Mostrar auditoría
        run: cat audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-diagnostics
          path: |
            audit.json
            package-lock.json
      - run: npm audit --audit-level=high
      - run: npm test
      - run: node --check index.js
      - name: Comprobar API real de eventos de Baileys
        run: |
          node --input-type=module <<'JS'
          import { makeEventBuffer } from '@whiskeysockets/baileys';
          import pino from 'pino';
          import assert from 'node:assert/strict';
          const ev = makeEventBuffer(pino({level:'silent'}));
          let calls = 0;
          const listener = () => calls++;
          ev.on('connection.update', listener);
          ev.emit('connection.update', {connection:'close'});
          ev.off('connection.update', listener);
          ev.emit('connection.update', {connection:'close'});
          assert.equal(calls, 1);
          JS
      - name: Comprobar puerto HTTP sin sesión real
        run: |
          PORT=18765 WHATSAPP_PHONE=12345678901 npm start > /tmp/historia.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          curl --retry 15 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:18765/health
