name: Pruebas del bot
on:
  push:
    branches: [test]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Auditoría de dependencias (incluye transitivas)
        run: npm audit --json > audit.json || true
      - name: Mostrar auditoría
        run: cat audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-diagnostics
          path: |
            audit.json
            package-lock.json
      - run: npm test
      - run: node --check index.js
